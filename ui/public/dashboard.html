<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Sparrow 管理面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="/wecom-helpers.js"></script>
  <script src="/channel-helpers.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(ellipse at 20% 10%, rgba(22,119,255,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(22,119,255,0.07) 0%, transparent 55%),
        #F0F6FF;
      color: #1D2B4E;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ===== Navigation ===== */
    .glass-nav {
      background: #FFFFFF;
      border-bottom: 1px solid #E0EEFF;
      box-shadow: 0 1px 8px rgba(22, 119, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 50;
      min-width: 0;
    }

    /* ===== Cards ===== */
    .glass-card {
      background: #FFFFFF;
      border: 1px solid #E0EEFF;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(22, 119, 255, 0.07);
      padding: 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s;
    }
    .glass-card:hover {
      box-shadow: 0 8px 32px rgba(22, 119, 255, 0.10);
    }

    /* ===== Brand text ===== */
    .brand-text {
      background: linear-gradient(135deg, #1677FF, #0958D9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    /* ===== Primary button ===== */
    .blue-btn {
      background: linear-gradient(135deg, #60A5FA, #1677FF);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(22, 119, 255, 0.3);
    }
    .blue-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1677FF, #0958D9);
      box-shadow: 0 4px 16px rgba(22, 119, 255, 0.4);
      transform: translateY(-1px);
    }
    .blue-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== Outline button ===== */
    .outline-btn {
      background: white;
      color: #1677FF;
      border: 1.5px solid #E0EEFF;
      border-radius: 8px;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .outline-btn:hover:not(:disabled) {
      background: #EBF3FF;
      border-color: #1677FF;
      color: #0958D9;
    }
    .outline-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== Cancel button ===== */
    .cancel-btn {
      background: white;
      color: #6B7A99;
      border: 1.5px solid #E0EEFF;
      border-radius: 8px;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cancel-btn:hover {
      background: #FAFAF9;
      border-color: #D6D3D1;
    }

    /* ===== Tabs ===== */
    .tab-active {
      background: linear-gradient(135deg, #60A5FA, #1677FF);
      color: white !important;
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(22, 119, 255, 0.25);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-inactive {
      color: #0958D9;
      background: transparent;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      font-weight: 500;
      white-space: nowrap;
    }
    .tab-inactive:hover { background: #E0EEFF; }

    /* ===== Input ===== */
    .light-input {
      background: white;
      border: 1.5px solid #E0EEFF;
      border-radius: 8px;
      padding: 10px 14px;
      color: #1D2B4E;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .light-input:focus {
      border-color: #1677FF;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15);
    }
    .light-input::placeholder { color: #6B7A99; }

    /* ===== Info cell ===== */
    .info-cell {
      background: #EBF3FF;
      border: 1px solid #E0EEFF;
      border-radius: 12px;
      padding: 1rem;
    }

    /* ===== Channel enabled border ===== */
    .channel-enabled { border-left: 4px solid #1677FF; }

    /* ===== Toggle ===== */
    .toggle-on  { background: linear-gradient(135deg, #60A5FA, #1677FF); }
    .toggle-off { background: #D1D5DB; }

    /* ===== Pulse animations ===== */
    @keyframes pulse-gold {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.15; }
    }
    .pulse-gold-ring { animation: pulse-gold 1.8s ease-in-out infinite; }

    @keyframes pulse-dot-std {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.6; transform: scale(1.15); }
    }
    .pulse-dot { animation: pulse-dot-std 1.8s ease-in-out infinite; }

    /* ===== Toast ===== */
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .toast-enter { animation: slideInUp 0.25s ease-out; }

    /* ===== Tab content fade ===== */
    .tab-content { animation: fadeIn 0.22s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ===== Edit button ===== */
    .edit-btn {
      color: #1677FF;
      border: 1px solid #E0EEFF;
      background: #EBF3FF;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .edit-btn:hover { background: #E0EEFF; border-color: #1677FF; }

    /* ===== Version badge ===== */
    .version-badge {
      background: #E0EEFF;
      color: #0958D9;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #E0EEFF;
      font-family: monospace;
    }

    /* ===== Note box ===== */
    .note-box {
      background: #EBF3FF;
      border: 1px solid #E0EEFF;
      color: #0958D9;
    }

    /* ===== Modal note ===== */
    .modal-note {
      background: #EBF3FF;
      border: 1px solid #E0EEFF;
      color: #0958D9;
    }

    /* ===== Action buttons ===== */
    .btn-start  { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .btn-start:hover:not(:disabled) { background: linear-gradient(135deg, #4ade80, #15803d); box-shadow: 0 6px 20px rgba(34,197,94,0.3); transform: translateY(-1px); }
    .btn-stop   { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-stop:hover:not(:disabled)  { background: linear-gradient(135deg, #f87171, #b91c1c); box-shadow: 0 6px 20px rgba(239,68,68,0.3);  transform: translateY(-1px); }
    .btn-start, .btn-stop { transition: all 0.2s ease; }
    .btn-start:disabled, .btn-stop:disabled { opacity: 0.35; transform: none; }

    /* ===== Card animate ===== */
    .card-animate { opacity: 0; }

    /* ===== Section title ===== */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #0958D9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #E0EEFF;
    }

    /* ===== Skill Store ===== */
    .skill-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #E0EEFF;
      background: white;
      transition: background 0.15s, border-color 0.15s;
    }
    .skill-row:hover { background: #F7FAFF; border-color: #C7D8F8; }
    .skill-row.installed { background: #F0FDF4; border-color: #BBF7D0; }

    .skill-install-btn {
      background: linear-gradient(135deg, #60A5FA, #1677FF);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .skill-install-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1677FF, #0958D9);
      transform: translateY(-1px);
    }
    .skill-install-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .skill-uninstall-btn {
      background: white;
      color: #DC2626;
      border: 1.5px solid #FCA5A5;
      border-radius: 6px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .skill-uninstall-btn:hover:not(:disabled) { background: #FEF2F2; border-color: #F87171; }
    .skill-uninstall-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .skill-category-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: #E0EEFF;
      color: #0958D9;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .skill-store-search {
      background: white;
      border: 1.5px solid #E0EEFF;
      border-radius: 8px;
      padding: 8px 14px;
      color: #1D2B4E;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .skill-store-search:focus {
      border-color: #1677FF;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }
    .skill-store-search::placeholder { color: #6B7A99; }

    .skill-page-btn {
      background: white;
      border: 1.5px solid #E0EEFF;
      color: #1677FF;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .skill-page-btn:hover:not(:disabled) { background: #EBF3FF; border-color: #1677FF; }
    .skill-page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  </style>
</head>
<body class="min-h-screen" x-data="dashboard()" x-init="init()">

  <!-- Toast Notifications -->
  <div class="fixed bottom-6 right-6 z-50 space-y-2">
    <template x-for="toast in toasts" :key="toast.id">
      <div
        class="toast-enter animate__animated animate__slideInUp flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium max-w-xs"
        :class="{
          'bg-green-500/90 text-white': toast.type === 'success',
          'bg-red-500/90 text-white':   toast.type === 'error',
          'bg-white text-blue-800':    toast.type === 'info'
        }"
        :style="toast.type === 'info' ? 'border:1px solid #E0EEFF;box-shadow:0 4px 16px rgba(22,119,255,0.10)' : ''"
      >
        <span x-text="toast.type === 'success' ? '✅' : toast.type === 'error' ? '❌' : 'ℹ️'"></span>
        <span x-text="toast.msg"></span>
      </div>
    </template>
  </div>

  <!-- Modal Backdrop -->
  <div
    x-show="modal.open"
    x-cloak
    class="fixed inset-0 z-40 flex items-center justify-center p-4"
    style="background:rgba(29,43,78,0.45);backdrop-filter:blur(4px)"
    @click.self="closeModal()"
  >
    <div
      class="animate__animated animate__fadeInUp w-full max-w-md"
      style="animation-duration:0.22s;background:white;border:1px solid #E0EEFF;border-radius:20px;box-shadow:0 8px 48px rgba(22,119,255,0.14)"
      @click.stop
    >
      <div class="flex items-center justify-between px-6 pt-6 pb-4"
           style="border-bottom:1px solid #E0EEFF">
        <h3 class="text-lg font-bold" style="color:#1D2B4E" x-text="modal.title"></h3>
        <button @click="closeModal()"
                style="color:#6B7A99;font-size:1.5rem;line-height:1;background:none;border:none;cursor:pointer;"
                onmouseover="this.style.color='#6B7A99'"
                onmouseout="this.style.color='#6B7A99'">&times;</button>
      </div>

      <div class="p-6 space-y-4">
        <!-- Feishu modal fields -->
        <template x-if="modal.channel === 'feishu'">
          <div class="space-y-4">
            <div class="modal-note rounded-lg p-3 text-xs">
              在飞书开放平台创建企业自建应用，开通机器人能力，启用长连接接收事件
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color:#6B7A99">App ID</label>
              <input type="text" x-model="modal.fields.appId" placeholder="cli_xxxxxxxxxxxxxxxx"
                     class="light-input" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color:#6B7A99">App Secret</label>
              <input type="password" x-model="modal.fields.appSecret" placeholder="••••••••••••••••"
                     class="light-input" />
            </div>
          </div>
        </template>

        <!-- Dingtalk modal fields -->
        <template x-if="modal.channel === 'dingtalk'">
          <div class="space-y-4">
            <div class="modal-note rounded-lg p-3 text-xs">
              在钉钉开放平台创建企业内部应用，添加机器人能力，消息接收模式选 Stream 模式
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color:#6B7A99">CorpId</label>
              <input type="text" x-model="modal.fields.corpId" placeholder="dingxxxxxxxxxxxxxxxxxxxxxxxx"
                     class="light-input" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Client ID（兼容 AppKey / Robot Code）</label>
              <input type="text" x-model="modal.fields.clientId" placeholder="dingxxxxxxxxxxxxxxxx"
                     class="light-input" />
              <p class="text-xs mt-1" style="color:#8AA0C5">Robot Code 与 Client ID 同值时，无需单独填写。</p>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Robot Code（可选单独填）</label>
              <input type="text" x-model="modal.fields.robotCode" placeholder="dingxxxxxxxxxxxxxxxx"
                     class="light-input" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Client Secret（兼容 AppSecret）</label>
              <input type="password" x-model="modal.fields.clientSecret" placeholder="••••••••••••••••"
                     class="light-input" />
            </div>
          </div>
        </template>

        <!-- Wecom modal fields -->
        <template x-if="modal.channel === 'wecom'">
          <div class="space-y-4">
            <div class="modal-note rounded-lg p-3 text-xs">
              社区企微插件主链路必填为 Bot ID + Bot Secret；CorpId / CorpSecret / AgentId 仅用于自建应用增强出站 / 回调入站。
            </div>
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Bot ID（必填）</label>
                <input type="text" x-model="modal.fields.botId" placeholder="aibxxxxxxxxxxxxxxxx"
                       class="light-input" />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Bot Secret（必填）</label>
                <input type="password" x-model="modal.fields.secret" placeholder="••••••••••••••••"
                       class="light-input" />
              </div>
            </div>
            <div class="rounded-lg border p-3 space-y-3" style="border-color:#E3E8F2;background:#FAFBFD">
              <div class="text-sm font-semibold" style="color:#1D2B4E">自建应用增强出站（可选）</div>
              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium mb-1" style="color:#6B7A99">CorpId</label>
                  <input type="text" x-model="modal.fields.corpId" placeholder="wwxxxxxxxxxxxxxxxx"
                         class="light-input" />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1" style="color:#6B7A99">CorpSecret</label>
                  <input type="password" x-model="modal.fields.corpSecret" placeholder="••••••••••••••••"
                         class="light-input" />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1" style="color:#6B7A99">AgentId</label>
                  <input type="text" x-model="modal.fields.agentId" placeholder="1000002"
                         class="light-input" />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Reply Format</label>
                  <select x-model="modal.fields.replyFormat" class="light-input">
                    <option value="">默认（markdown）</option>
                    <option value="markdown">markdown</option>
                    <option value="text">text</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="rounded-lg border p-3 space-y-3" style="border-color:#E3E8F2;background:#FAFBFD">
              <div class="text-sm font-semibold" style="color:#1D2B4E">回调入站（可选，需与自建应用字段一起完整填写）</div>
              <div class="grid md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Callback Token</label>
                  <input type="text" x-model="modal.fields.callbackToken" placeholder="callback-token"
                         class="light-input" />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1" style="color:#6B7A99">EncodingAESKey</label>
                  <input type="password" x-model="modal.fields.encodingAESKey" placeholder="43 位 AES Key"
                         class="light-input" />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Callback Path</label>
                  <input type="text" x-model="modal.fields.callbackPath" placeholder="/webhooks/app"
                         class="light-input" />
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div class="px-6 pb-6 flex gap-3">
        <button @click="closeModal()" class="cancel-btn flex-1 py-2.5 rounded-xl text-sm font-medium">
          取消
        </button>
        <button @click="saveChannelConfig()"
                :disabled="modal.saving"
                class="blue-btn flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
          <span x-show="modal.saving" class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span x-text="modal.saving ? '保存中…' : '保存'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Top Navigation -->
  <nav class="glass-nav sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between py-3 gap-4 flex-wrap">
        <!-- Logo -->
        <div class="flex items-center gap-2 select-none flex-shrink-0 min-w-0">
          <img src="logo.png" width="36" height="36" style="border-radius:50%;object-fit:cover;flex-shrink:0;min-width:36px;min-height:36px;" alt="Open Sparrow">
          <span class="font-bold text-lg brand-text whitespace-nowrap">Open Sparrow</span>
        </div>

        <!-- Tabs -->
        <div style="display:flex;align-items:center;gap:4px;background:#E0EEFF;border-radius:10px;padding:4px;">
          <template x-for="(tab, i) in tabs" :key="i">
            <button
              @click="switchTab(tab.key)"
              :class="activeTab === tab.key ? 'tab-active' : 'tab-inactive'"
              x-text="tab.label"
            ></button>
          </template>
        </div>

        <!-- Version badge -->
        <div class="version-badge">
          v<span x-text="version"></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">

    <!-- Tab 1: Service Status -->
    <div x-show="activeTab === 'status'" x-cloak class="tab-content space-y-6">

      <!-- Big Status Card -->
      <div class="glass-card rounded-2xl p-8 card-animate">
        <div class="flex flex-col sm:flex-row sm:items-center gap-6">
          <!-- Status Indicator -->
          <div class="flex items-center gap-4">
            <div class="relative w-16 h-16 flex items-center justify-center">
              <!-- Pulse ring -->
              <div
                class="absolute w-full h-full rounded-full"
                :class="serviceStatus === 'running' ? 'pulse-gold-ring' : ''"
                :style="serviceStatus === 'running'
                  ? 'background:rgba(22,119,255,0.18)'
                  : 'background:#E0EEFF'"
              ></div>
              <!-- Core dot -->
              <div
                class="relative w-8 h-8 rounded-full"
                :class="serviceStatus === 'running' ? 'pulse-dot' : ''"
                :style="serviceStatus === 'running'
                  ? 'background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 0 16px rgba(34,197,94,0.4)'
                  : 'background:#E0EEFF'"
              ></div>
            </div>
            <div>
              <p class="text-sm mb-0.5" style="color:#0958D9;font-weight:500">服务状态</p>
              <p
                class="text-2xl font-bold"
                :class="serviceStatus === 'running' ? 'text-green-600' : 'text-blue-300'"
                x-text="serviceStatus === 'running' ? '运行中' : '已停止'"
              ></p>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex gap-3 sm:ml-auto flex-wrap">
            <button
              @click="daemonAction('start')"
              :disabled="daemonLoading || serviceStatus === 'running'"
              class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold text-white transition disabled:opacity-35"
              :class="serviceStatus === 'running' ? '' : 'btn-start'"
              :style="serviceStatus === 'running' ? 'background:#E0EEFF;color:#6B7A99;cursor:not-allowed' : ''"
            >
              <span x-show="daemonLoading && daemonAction_ === 'start'" class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin inline-block"></span>
              ▶ 启动
            </button>
            <button
              @click="daemonAction('stop')"
              :disabled="daemonLoading || serviceStatus !== 'running'"
              class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold text-white transition disabled:opacity-35"
              :class="serviceStatus !== 'running' ? '' : 'btn-stop'"
              :style="serviceStatus !== 'running' ? 'background:#E0EEFF;color:#6B7A99;cursor:not-allowed' : ''"
            >
              <span x-show="daemonLoading && daemonAction_ === 'stop'" class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin inline-block"></span>
              ⏹ 停止
            </button>
            <button
              @click="daemonAction('restart')"
              :disabled="daemonLoading"
              class="blue-btn flex items-center gap-2 px-5 py-2.5 text-white rounded-xl text-sm font-semibold"
            >
              <span x-show="daemonLoading && daemonAction_ === 'restart'" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin inline-block"></span>
              🔄 重启
            </button>
            <button
              @click="cleanupEnvironment()"
              :disabled="daemonLoading || cleanupLoading || resetLoading"
              class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold transition"
              :style="cleanupLoading
                ? 'background:#FEE2E2;color:#B91C1C;opacity:0.65;cursor:not-allowed'
                : 'background:#FEE2E2;color:#B91C1C;border:1px solid #FCA5A5'"
            >
              <span x-show="cleanupLoading" class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin inline-block"></span>
              🧹 快速清理
            </button>
            <button
              @click="factoryReset()"
              :disabled="daemonLoading || cleanupLoading || resetLoading"
              class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold transition"
              :style="resetLoading
                ? 'background:#7F1D1D;color:#FCA5A5;opacity:0.65;cursor:not-allowed'
                : 'background:#991B1B;color:#FEE2E2;border:1px solid #EF4444'"
            >
              <span x-show="resetLoading" class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin inline-block"></span>
              🧨 全量重置（删配置）
            </button>
          </div>
        </div>
      </div>

      <!-- Service Info -->
      <div class="glass-card rounded-2xl p-6 card-animate">
        <h3 class="text-base font-bold mb-4" style="color:#1D2B4E">基本信息</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="info-cell">
            <p class="text-xs mb-1 uppercase tracking-wide" style="color:#0958D9;font-weight:600">Profile</p>
            <p class="font-semibold text-sm" style="color:#1D2B4E" x-text="serviceInfo.profile || '—'"></p>
          </div>
          <div class="info-cell">
            <p class="text-xs mb-1 uppercase tracking-wide" style="color:#0958D9;font-weight:600">配置路径</p>
            <p class="font-mono text-xs truncate" style="color:#6B7A99" x-text="serviceInfo.configPath || '—'"></p>
          </div>
          <div class="info-cell">
            <p class="text-xs mb-1 uppercase tracking-wide" style="color:#0958D9;font-weight:600">端口</p>
            <p class="font-semibold text-sm" style="color:#1D2B4E" x-text="serviceInfo.port || '—'"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: Channel Config -->
    <div x-show="activeTab === 'channels'" x-cloak class="tab-content space-y-4">
      <template x-for="ch in channelCards" :key="ch.key">
        <div class="glass-card rounded-2xl p-6 card-animate"
             :class="ch.enabled ? 'channel-enabled' : ''">
          <div class="flex items-start gap-4">
            <!-- Icon -->
            <span class="text-3xl mt-0.5" x-text="ch.icon"></span>

            <!-- Info -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-3 flex-wrap">
                <h3 class="font-bold text-base" style="color:#1D2B4E" x-text="ch.name"></h3>
                <!-- Toggle -->
                <button
                  @click="toggleChannel(ch)"
                  class="relative inline-flex h-6 w-11 items-center rounded-full transition-all duration-200 focus:outline-none"
                  :class="ch.enabled ? 'toggle-on shadow-md' : 'toggle-off'"
                  :style="ch.enabled ? 'box-shadow:0 2px 8px rgba(22,119,255,0.35)' : ''"
                  :aria-label="ch.enabled ? '禁用' : '启用'"
                >
                  <span
                    class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform duration-200"
                    :class="ch.enabled ? 'translate-x-6' : 'translate-x-1'"
                  ></span>
                </button>
                <span class="text-xs font-medium"
                      :style="ch.enabled ? 'color:#1677FF' : 'color:#6B7A99'"
                      x-text="ch.enabled ? '已启用' : '已禁用'"></span>
              </div>

              <!-- Field summary -->
              <div class="mt-2 space-y-1">
                <template x-for="field in ch.summaryFields" :key="field.label">
                  <div class="flex items-center gap-2 text-xs" style="color:#0958D9">
                    <span class="w-20 flex-shrink-0" x-text="field.label + '：'"></span>
                    <span class="font-mono" style="color:#6B7A99" x-text="field.value"></span>
                  </div>
                </template>
              </div>

              <div
                x-show="ch.key === 'dingtalk'"
                class="mt-4 rounded-xl p-3"
                style="background:#F7FAFF;border:1px solid #C7D8F8"
              >
                <div class="flex items-start justify-between gap-3 flex-wrap">
                  <div>
                    <div class="text-xs font-semibold" style="color:#0958D9">钉钉诊断</div>
                    <p class="text-xs mt-1" style="color:#6B7A99">用于 packaged read-back / lifecycle 对照，不代表 PASS。</p>
                  </div>
                  <button
                    @click="refreshDingtalkDiagnostics()"
                    :disabled="ch.diagnosticsLoading"
                    class="edit-btn flex items-center gap-2"
                  >
                    <span x-show="ch.diagnosticsLoading" class="inline-block w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
                    <span x-text="ch.diagnosticsLoading ? '刷新中…' : '刷新读回'"></span>
                  </button>
                </div>

                <div x-show="ch.diagnostics" class="mt-3 space-y-3">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span
                      class="text-xs font-semibold px-2 py-1 rounded-full"
                      :style="diagnosticsStatusStyle(ch.diagnostics)"
                      x-text="diagnosticsStatusLabel(ch.diagnostics)"
                    ></span>
                    <span class="text-xs" style="color:#6B7A99" x-text="`daemon=${ch.diagnostics?.daemon || 'unknown'}`"></span>
                  </div>
                  <p
                    x-show="ch.diagnostics?.probe?.summary"
                    class="text-xs font-mono break-all rounded-lg p-3"
                    style="background:white;border:1px solid #E0EEFF;color:#1D2B4E"
                    x-text="ch.diagnostics?.probe?.summary || ''"
                  ></p>
                  <template x-if="Array.isArray(ch.diagnostics?.checks) && ch.diagnostics.checks.length > 0">
                    <div>
                      <div class="text-xs font-semibold mb-1" style="color:#0958D9">检查项</div>
                      <template x-for="(item, idx) in ch.diagnostics.checks" :key="'dt-check-' + idx">
                        <p class="text-xs mb-1" style="color:#1D2B4E" x-text="'• ' + item"></p>
                      </template>
                    </div>
                  </template>
                  <template x-if="Array.isArray(ch.diagnostics?.warnings) && ch.diagnostics.warnings.length > 0">
                    <div>
                      <div class="text-xs font-semibold mb-1" style="color:#B45309">告警</div>
                      <template x-for="(item, idx) in ch.diagnostics.warnings" :key="'dt-warning-' + idx">
                        <p class="text-xs mb-1" style="color:#92400E" x-text="'• ' + item"></p>
                      </template>
                    </div>
                  </template>
                  <template x-if="Array.isArray(ch.diagnostics?.errors) && ch.diagnostics.errors.length > 0">
                    <div>
                      <div class="text-xs font-semibold mb-1" style="color:#DC2626">未闭合项</div>
                      <template x-for="(item, idx) in ch.diagnostics.errors" :key="'dt-error-' + idx">
                        <p class="text-xs mb-1" style="color:#B91C1C" x-text="'• ' + item"></p>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Edit Button -->
            <button
              @click="openModal(ch)"
              class="edit-btn flex-shrink-0 px-4 py-2 text-sm font-medium rounded-xl"
            >
              编辑
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- Tab 3: API Config -->
    <div x-show="activeTab === 'api'" x-cloak class="tab-content">
      <div class="glass-card rounded-2xl p-8 max-w-xl card-animate">
        <h2 class="text-lg font-bold mb-1" style="color:#1D2B4E">API 配置</h2>
        <p class="text-sm mb-6" style="color:#6B7A99">支持任意 OpenAI 兼容接口，包括 Azure、国内中转等</p>

        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium mb-1" style="color:#6B7A99">Base URL</label>
            <input type="text" x-model="apiForm.baseUrl"
                   placeholder="https://api.openai.com/v1 或你的中转地址"
                   class="light-input" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" style="color:#6B7A99">API Key</label>
            <div class="relative">
              <input
                :type="showApiKey ? 'text' : 'password'"
                x-model="apiForm.apiKey"
                :placeholder="showApiKey ? '请输入 API Key' : 'sk-xxxxxxxxxxxxxxxxxxxxxxxx'"
                class="light-input"
                style="padding-right:60px"
              />
              <button
                @click="showApiKey = !showApiKey"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium transition-colors"
                style="color:#1677FF;background:none;border:none;cursor:pointer"
                onmouseover="this.style.color='#0958D9'"
                onmouseout="this.style.color='#1677FF'"
                x-text="showApiKey ? '隐藏' : '显示'"
              ></button>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" style="color:#6B7A99">模型名称</label>
            <input type="text" x-model="apiForm.model"
                   placeholder="请输入模型名称，如 gpt-4o-mini"
                   class="light-input" />
          </div>

          <button
            @click="saveApiConfig()"
            :disabled="apiSaving"
            class="blue-btn w-full font-semibold py-3 rounded-xl flex items-center justify-center gap-2"
            style="box-shadow:0 4px 16px rgba(22,119,255,0.25)"
          >
            <span x-show="apiSaving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin inline-block"></span>
            <span x-text="apiSaving ? '保存中…' : '保存配置'"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Tab 4: Skill Store -->
    <div x-show="activeTab === 'skills'" x-cloak class="tab-content space-y-4">

      <!-- Search + Filter bar -->
      <div class="glass-card rounded-2xl p-5 card-animate">
        <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
          <div class="flex-1 relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-lg">🔍</span>
            <input
              type="text"
              x-model="skillSearch"
              @input="onSkillSearchInput()"
              placeholder="搜索 Skill 名称…"
              class="skill-store-search w-full"
              style="padding-left:36px"
            />
          </div>
          <select
            x-model="skillCategory"
            @change="onSkillCategoryChange()"
            class="skill-store-search"
            style="min-width:140px;cursor:pointer"
          >
            <template x-for="cat in skillCategories" :key="cat.key">
              <option :value="cat.key" x-text="cat.label"></option>
            </template>
          </select>
          <button
            @click="loadSkills()"
            class="blue-btn flex items-center justify-center gap-1"
            style="white-space:nowrap;padding:8px 18px"
          >
            <span x-show="skillLoading" class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span x-show="!skillLoading">🔄</span>
            刷新
          </button>
        </div>
      </div>

      <!-- Stats bar -->
      <div class="glass-card rounded-2xl px-5 py-3 card-animate flex items-center gap-3" style="margin-bottom:0">
        <span class="text-lg">📦</span>
        <span class="text-sm font-medium" style="color:#1D2B4E">
          已安装：<strong x-text="skillInstalled" style="color:#1677FF"></strong>
          /
          <strong x-text="skillTotal"></strong>
          个 Skill
        </span>
        <span x-show="skillLoading" class="ml-auto text-xs" style="color:#6B7A99">加载中…</span>
      </div>

      <!-- Skill list -->
      <div class="glass-card rounded-2xl p-4 card-animate">

        <!-- Empty state -->
        <div x-show="!skillLoading && skillList.length === 0" class="py-16 text-center">
          <div class="text-5xl mb-3">🧩</div>
          <p class="font-medium" style="color:#6B7A99">
            <span x-show="skillSearch || skillCategory">没有匹配的 Skill</span>
            <span x-show="!skillSearch && !skillCategory">暂无 Skill 数据，请点击「刷新」加载</span>
          </p>
        </div>

        <!-- Loading spinner -->
        <div x-show="skillLoading && skillList.length === 0" class="py-16 flex items-center justify-center gap-3">
          <span class="inline-block w-6 h-6 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>
          <span class="text-sm" style="color:#6B7A99">正在加载 Skill 列表…</span>
        </div>

        <!-- Skill rows -->
        <div class="space-y-2">
          <template x-for="skill in skillList" :key="skillKey(skill)">
            <div
              class="skill-row"
              :class="skill.installed ? 'installed' : ''"
            >
              <!-- Installed indicator -->
              <span class="text-base flex-shrink-0" x-text="skill.installed ? '✅' : '⬜'"></span>

              <!-- Name -->
              <span
                class="flex-1 min-w-0 text-sm font-medium truncate"
                style="color:#1D2B4E"
                :title="skillKey(skill)"
                x-text="skill.name"
              ></span>

              <!-- Category tag -->
              <span
                x-show="skill.category"
                class="skill-category-tag"
                x-text="skill.category"
              ></span>

              <!-- Description -->
              <span
                class="hidden sm:block text-xs truncate"
                style="color:#6B7A99;max-width:220px;flex-shrink:1"
                :title="skill.description"
                x-text="skill.description || '—'"
              ></span>

              <!-- Action button -->
              <template x-if="skill.installed">
                <button
                  @click="uninstallSkill(skill)"
                  :disabled="skillActionLoading[skillKey(skill)]"
                  class="skill-uninstall-btn"
                >
                  <span x-show="skillActionLoading[skillKey(skill)]" class="inline-block w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin mr-1"></span>
                  卸载
                </button>
              </template>
              <template x-if="!skill.installed">
                <button
                  @click="installSkill(skill)"
                  :disabled="skillActionLoading[skillKey(skill)]"
                  class="skill-install-btn"
                >
                  <span x-show="skillActionLoading[skillKey(skill)]" class="inline-block w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin mr-1"></span>
                  安装
                </button>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- Pagination -->
      <div x-show="skillTotal > 0" class="flex items-center justify-center gap-4 py-2">
        <button
          @click="skillPrevPage()"
          :disabled="skillPage <= 1 || skillLoading"
          class="skill-page-btn"
        >
          ← 上一页
        </button>
        <span class="text-sm font-medium" style="color:#1D2B4E">
          第 <strong x-text="skillPage"></strong> /
          <strong x-text="skillTotalPages()"></strong> 页
        </span>
        <button
          @click="skillNextPage()"
          :disabled="skillPage >= skillTotalPages() || skillLoading"
          class="skill-page-btn"
        >
          下一页 →
        </button>
      </div>

    </div>

  </main>

  <script>
    function dashboard() {
      return {
        // Navigation
        activeTab: 'status',
        tabs: [
          { key: 'status',   label: '服务状态' },
          { key: 'channels', label: '渠道配置' },
          { key: 'api',      label: 'API 配置' },
          { key: 'skills',   label: '🧩 Skill 商店' },
        ],
        version: '—',

        // Status Tab
        serviceStatus: 'stopped',
        daemonLoading: false,
        daemonAction_: '',
        cleanupLoading: false,
        resetLoading: false,
        serviceInfo: {
          profile: '',
          configPath: '',
          port: '',
        },
        statusSnapshot: {
          installed: false,
          daemon: 'unknown',
          runtimeMode: 'unknown',
          configExists: true,
          profileDirExists: true,
        },

        // Channels Tab
        channelCards: [
          {
            key: 'feishu',
            icon: '🐦',
            name: '飞书 / Lark',
            enabled: false,
            fields: window.OpenSparrowChannels.createEmptyUiFields('feishu'),
            summaryFields: [],
            diagnostics: null,
            diagnosticsLoading: false,
          },
          {
            key: 'dingtalk',
            icon: '📎',
            name: '钉钉',
            enabled: false,
            fields: window.OpenSparrowChannels.createEmptyUiFields('dingtalk'),
            summaryFields: [],
            diagnostics: null,
            diagnosticsLoading: false,
          },
          {
            key: 'wecom',
            icon: '💼',
            name: '企业微信',
            enabled: false,
            fields: window.OpenSparrowChannels.createEmptyUiFields('wecom'),
            summaryFields: [],
            diagnostics: null,
            diagnosticsLoading: false,
          },
        ],

        // API Tab
        apiForm: { baseUrl: '', apiKey: '', model: '' },
        apiSaving: false,
        showApiKey: false,

        // Skill Store Tab
        skillList: [],
        skillTotal: 0,
        skillInstalled: 0,
        skillSearch: '',
        skillCategory: '',
        skillPage: 1,
        skillPageSize: 50,
        skillLoading: false,
        skillCategories: [
          { key: '', label: '全部分类' },
        ],
        skillActionLoading: {},  // { 'category/filename': true }
        _skillSearchTimer: null,

        // Modal
        modal: {
          open: false,
          channel: '',
          title: '',
          fields: {},
          saving: false,
        },

        // Toast
        toasts: [],
        toastCounter: 0,
        requestTimeout: {
          status: 10000,
          daemon: 90000,
          cleanup: 90000,
          reset: 120000,
          save: 90000,
        },

        // ─── Lifecycle ───────────────────────────────────────────────

        async init() {
          const keepOnDashboard = await this.loadStatus({ redirectOnReset: true });
          if (!keepOnDashboard) return;
          await this.loadConfig();
          await this.refreshDingtalkDiagnostics();
          this.$nextTick(() => this._animateCards());
        },

        switchTab(key) {
          this.activeTab = key;
          this.$nextTick(() => this._animateCards());
          if (key === 'skills') this.loadSkills();
        },

        _animateCards() {
          if (typeof anime !== 'undefined') {
            anime({
              targets: '.card-animate',
              opacity: [0, 1],
              translateY: [20, 0],
              delay: anime.stagger(80),
              duration: 500,
              easing: 'easeOutQuart'
            });
          }
        },

        shouldRedirectToSetup(status) {
          const params = new URLSearchParams(window.location.search);
          if (params.has('force')) return true;
          return status.installed !== true && status.configExists === false;
        },

        async loadStatus(options = {}) {
          try {
            const res = await this.fetchWithTimeout('/api/status', {}, this.requestTimeout.status);
            if (!res.ok) return true;
            const data = await res.json();
            this.statusSnapshot.installed = data.installed === true;
            this.statusSnapshot.daemon = data.daemon || 'unknown';
            this.statusSnapshot.runtimeMode = data.runtimeMode || 'unknown';
            this.statusSnapshot.configExists = data.configExists !== false;
            this.statusSnapshot.profileDirExists = data.profileDirExists !== false;
            this.serviceStatus = data.daemon === 'running' ? 'running' : 'stopped';
            this.version = data.version || '1.0.0';
            this.serviceInfo.profile = data.profile || 'usb-portable';
            this.serviceInfo.configPath = data.configPath || '';
            this.serviceInfo.port = String(data.gatewayPort ?? '') || '—';

            if (options.redirectOnReset === true && this.shouldRedirectToSetup(this.statusSnapshot)) {
              window.location.replace('/setup?force=1');
              return false;
            }
            return true;
          } catch (_) {
            // Gracefully degrade when backend unavailable
            this.version = '1.0.0';
            return true;
          }
        },

        async loadConfig() {
          try {
            const res = await this.fetchWithTimeout('/api/config', {}, this.requestTimeout.status);
            if (!res.ok) {
              // Config not yet created — build empty summaries and return
              this.channelCards.forEach(card => {
                card.enabled = false;
                card.fields = window.OpenSparrowChannels.createEmptyUiFields(card.key);
                card.summaryFields = this.buildSummaryFields(card.key, card.fields);
              });
              return false;
            }
            const data = await res.json();

            // Populate channel cards from channels object
            const channels = data?.channels || {};
            this.channelCards.forEach(card => {
              const ch = channels[card.key];
              card.enabled = Boolean(ch) && ch.enabled !== false;
              card.fields = {
                ...window.OpenSparrowChannels.createEmptyUiFields(card.key),
                ...window.OpenSparrowChannels.normalizeUiFields(card.key, ch || {}),
              };
              card.summaryFields = this.buildSummaryFields(card.key, card.fields);
            });
            return true;
          } catch (_) {
            // Use defaults
            this.channelCards.forEach(card => {
              card.summaryFields = this.buildSummaryFields(card.key, card.fields);
            });
            return false;
          }
        },

        // ─── Helpers ─────────────────────────────────────────────────

        buildSummaryFields(channelKey, fields) {
          const normalized = window.OpenSparrowChannels.normalizeUiFields(channelKey, fields);
          const mask = (v) => {
            if (!v) return '未配置';
            if (v.length <= 6) return v.slice(0, 2) + '***';
            return v.slice(0, 6) + '***';
          };

          if (channelKey === 'feishu') {
            return [
              { label: 'App ID',     value: mask(normalized.appId) },
              { label: 'App Secret', value: mask(normalized.appSecret) },
            ];
          }
          if (channelKey === 'dingtalk') {
            return [
              { label: 'CorpId', value: mask(normalized.corpId) },
              { label: 'Client ID', value: mask(normalized.clientId || normalized.robotCode) },
              { label: 'RobotCode', value: mask(normalized.robotCode || normalized.clientId) },
              { label: 'Client Secret', value: mask(normalized.clientSecret) },
            ];
          }
          if (channelKey === 'wecom') {
            const rows = [
              { label: 'Bot ID',     value: mask(normalized.botId) },
              { label: 'Bot Secret', value: mask(normalized.secret) },
            ];
            if (normalized.corpId) rows.push({ label: 'CorpId', value: mask(normalized.corpId) });
            if (normalized.agentId) rows.push({ label: 'AgentId', value: String(normalized.agentId) });
            if (normalized.callbackPath) rows.push({ label: 'Callback', value: normalized.callbackPath });
            return rows;
          }
          return [];
        },

        diagnosticsStatusLabel(report) {
          if (!report || typeof report !== 'object') return '未检测';
          if (report.status === 'ok') return '已读回';
          if (report.status === 'warning') return '需补 fresh live verification';
          return '配置未闭合';
        },

        diagnosticsStatusStyle(report) {
          if (!report || typeof report !== 'object') {
            return 'background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE';
          }
          if (report.status === 'ok') {
            return 'background:#ECFDF5;color:#047857;border:1px solid #A7F3D0';
          }
          if (report.status === 'warning') {
            return 'background:#FFFBEB;color:#B45309;border:1px solid #FDE68A';
          }
          return 'background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA';
        },

        normalizeDiagnosticsReport(report, fallbackError = '') {
          const raw = report && typeof report === 'object' ? report : {};
          const errors = Array.isArray(raw.errors) ? raw.errors.slice() : [];
          if (fallbackError && errors.length === 0) {
            errors.push(fallbackError);
          }
          const probe = raw.probe && typeof raw.probe === 'object' ? raw.probe : {};
          return {
            status: raw.status === 'ok' || raw.status === 'warning' ? raw.status : 'error',
            ready: raw.ready === true,
            daemon: typeof raw.daemon === 'string' ? raw.daemon : (this.statusSnapshot.daemon || 'unknown'),
            checks: Array.isArray(raw.checks) ? raw.checks.slice() : [],
            warnings: Array.isArray(raw.warnings) ? raw.warnings.slice() : [],
            errors,
            probe: {
              code: typeof probe.code === 'number' ? probe.code : null,
              summary: String(probe.summary ?? '').trim(),
            },
          };
        },

        async refreshDingtalkDiagnostics() {
          const card = this.channelCards.find((entry) => entry.key === 'dingtalk');
          if (!card) return false;

          const hasReplayValue = window.OpenSparrowChannels.hasReplayValue('dingtalk', card.fields);
          if (!card.enabled && !hasReplayValue) {
            card.diagnostics = null;
            card.diagnosticsLoading = false;
            return false;
          }

          card.diagnosticsLoading = true;
          try {
            const res = await this.fetchWithTimeout('/api/dingtalk/probe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({}),
            }, this.requestTimeout.status);
            const payload = await res.json().catch(() => ({}));
            const fallbackError = res.ok ? '' : `钉钉诊断请求失败（HTTP ${res.status}）`;
            card.diagnostics = this.normalizeDiagnosticsReport(payload, fallbackError);
            return res.ok;
          } catch (e) {
            card.diagnostics = this.normalizeDiagnosticsReport({}, `钉钉诊断请求失败：${e?.message ?? String(e)}`);
            return false;
          } finally {
            card.diagnosticsLoading = false;
          }
        },

        showToast(msg, type = 'success') {
          const id = ++this.toastCounter;
          this.toasts.push({ id, msg, type });
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
          }, 3000);
        },

        async fetchWithTimeout(url, options = {}, timeoutMs = 30000) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), timeoutMs);
          try {
            return await fetch(url, { ...options, signal: controller.signal });
          } finally {
            clearTimeout(timer);
          }
        },

        // ─── Daemon Actions ───────────────────────────────────────────

        async daemonAction(action) {
          this.daemonLoading = true;
          this.daemonAction_ = action;
          try {
            const res = await this.fetchWithTimeout('/api/daemon', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action }),
            }, this.requestTimeout.daemon);
            if (res.ok) {
              this.showToast(
                action === 'start' ? '服务已启动' :
                action === 'stop'  ? '服务已停止' : '服务已重启'
              );
              // Refresh status after a short delay
              await new Promise(r => setTimeout(r, 800));
              await this.loadStatus();
              await this.refreshDingtalkDiagnostics();
            } else {
              const err = await res.json().catch(() => ({}));
              this.showToast(err.message || '操作失败', 'error');
            }
          } catch (e) {
            if (e?.name === 'AbortError') {
              this.showToast(`服务操作超时（>${Math.round(this.requestTimeout.daemon / 1000)}秒）`, 'error');
            } else {
              this.showToast('无法连接到服务：' + e.message, 'error');
            }
          } finally {
            this.daemonLoading = false;
            this.daemonAction_ = '';
          }
        },

        async cleanupEnvironment() {
          const confirmed = window.confirm(
            '将执行“快速清理”：停止/卸载 daemon，并尝试释放当前 gateway 端口（不会删除配置文件与凭证）。确定继续吗？'
          );
          if (!confirmed) return;

          this.cleanupLoading = true;
          try {
            const res = await this.fetchWithTimeout('/api/cleanup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({}),
            }, this.requestTimeout.cleanup);
            const data = await res.json().catch(() => ({}));

            if (res.ok && data.ok !== false) {
              const warning = Array.isArray(data.warnings) && data.warnings.length > 0
                ? `；告警：${data.warnings.join('；')}`
                : '';
              this.showToast(`快速清理完成（未删配置）${warning}`);
            } else {
              const msg = Array.isArray(data.errors) && data.errors.length > 0
                ? data.errors.join('; ')
                : (data.error || '清理失败');
              this.showToast(msg, 'error');
            }

            await new Promise(r => setTimeout(r, 500));
            await this.loadStatus();
            await this.refreshDingtalkDiagnostics();
          } catch (e) {
            if (e?.name === 'AbortError') {
              this.showToast(`快速清理超时（>${Math.round(this.requestTimeout.cleanup / 1000)}秒）`, 'error');
            } else {
              this.showToast('无法连接到服务：' + e.message, 'error');
            }
          } finally {
            this.cleanupLoading = false;
          }
        },

        async factoryReset() {
          const confirmed = window.confirm(
            '将执行全量重置：停止服务、卸载 daemon、删除当前 profile 状态与 workspace，并删除 superpowers skills。该操作不可撤销。确定继续吗？'
          );
          if (!confirmed) return;

          this.resetLoading = true;
          try {
            const res = await this.fetchWithTimeout('/api/reset', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cleanupSkills: true }),
            }, this.requestTimeout.reset);
            const data = await res.json().catch(() => ({}));

            if (res.ok && data.ok !== false) {
              const warning = Array.isArray(data.warnings) && data.warnings.length > 0
                ? `，但有告警：${data.warnings.join('；')}`
                : '';
              this.showToast(`全量重置完成${warning}`);
              setTimeout(() => {
                window.location.href = '/?force=1';
              }, 700);
              return;
            }

            const msg = Array.isArray(data.errors) && data.errors.length > 0
              ? data.errors.join('; ')
              : (data.error || '全量重置失败');
            this.showToast(msg, 'error');

            if (data.resetComplete === true) {
              this.showToast('核心重置已完成，正在返回安装向导');
              setTimeout(() => {
                window.location.href = '/?force=1';
              }, 900);
            }
          } catch (e) {
            if (e?.name === 'AbortError') {
              this.showToast(`全量重置超时（>${Math.round(this.requestTimeout.reset / 1000)}秒）`, 'error');
            } else {
              this.showToast('无法连接到服务：' + e.message, 'error');
            }
          } finally {
            this.resetLoading = false;
          }
        },

        // ─── Channel Toggle ───────────────────────────────────────────

        async toggleChannel(ch) {
          const newEnabled = !ch.enabled;
          ch.enabled = newEnabled;
          try {
            if (newEnabled) {
              const validation = window.OpenSparrowChannels.validateUiFields(ch.key, ch.fields);
              if (Array.isArray(validation.errors) && validation.errors.length > 0) {
                ch.enabled = !newEnabled;
                this.showToast(validation.errors.join('；'), 'error');
                return;
              }
            }

            const payload = newEnabled
              ? window.OpenSparrowChannels.buildChannelPayload(ch.key, ch.fields, { enabled: newEnabled })
              : { type: ch.key, enabled: newEnabled };

            const res = await this.fetchWithTimeout('/api/config/channels', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            }, this.requestTimeout.save);
            if (res.ok) {
              const reloaded = await this.loadConfig();
              if (ch.key === 'dingtalk') {
                await this.refreshDingtalkDiagnostics();
              }
              this.showToast(
                reloaded
                  ? `${ch.name} 已${newEnabled ? '启用' : '禁用'}，服务将自动重启`
                  : `${ch.name} 已${newEnabled ? '启用' : '禁用'}，但 authoritative 回读失败，请刷新后确认`,
                reloaded ? 'success' : 'error'
              );
            } else {
              ch.enabled = !newEnabled; // revert
              this.showToast('更新失败', 'error');
            }
          } catch (e) {
            ch.enabled = !newEnabled; // revert
            this.showToast('无法连接到服务', 'error');
          }
        },

        // ─── Modal ────────────────────────────────────────────────────

        openModal(ch) {
          this.modal.channel = ch.key;
          this.modal.title   = `编辑 ${ch.name} 凭证`;
          this.modal.fields  = { ...window.OpenSparrowChannels.normalizeUiFields(ch.key, ch.fields) };
          this.modal.saving  = false;
          this.modal.open    = true;
        },

        closeModal() {
          this.modal.open = false;
        },

        async saveChannelConfig() {
          this.modal.saving = true;
          const ch = this.channelCards.find(c => c.key === this.modal.channel);
          try {
            const validation = window.OpenSparrowChannels.validateUiFields(this.modal.channel, this.modal.fields);
            if (Array.isArray(validation.errors) && validation.errors.length > 0) {
              this.showToast(validation.errors.join('；'), 'error');
              return;
            }

            const payloadFields = window.OpenSparrowChannels.buildChannelPayload(this.modal.channel, this.modal.fields);
            const res = await this.fetchWithTimeout('/api/config/channels', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: this.modal.channel,
                enabled: ch ? ch.enabled : true,
                ...payloadFields,
              }),
            }, this.requestTimeout.save);
            if (res.ok) {
              const reloaded = await this.loadConfig();
              if (this.modal.channel === 'dingtalk') {
                await this.refreshDingtalkDiagnostics();
              }
              this.closeModal();
              this.showToast(
                reloaded
                  ? '配置已更新，服务将自动重启'
                  : '配置已更新，但 authoritative 回读失败，请刷新后确认',
                reloaded ? 'success' : 'error'
              );
            } else {
              const err = await res.json().catch(() => ({}));
              const detail = err.message || (Array.isArray(err.errors) ? err.errors.join(' | ') : '');
              this.showToast(detail || '保存失败', 'error');
            }
          } catch (e) {
            this.showToast('无法连接到服务', 'error');
          } finally {
            this.modal.saving = false;
          }
        },

        // ─── Skill Store ─────────────────────────────────────────────

        async loadSkills() {
          if (this.skillLoading) return;
          this.skillLoading = true;
          try {
            const params = new URLSearchParams({
              page: this.skillPage,
              pageSize: this.skillPageSize,
            });
            if (this.skillCategory) params.set('category', this.skillCategory);
            if (this.skillSearch.trim()) params.set('search', this.skillSearch.trim());

            const res = await this.fetchWithTimeout(`/api/skills/list?${params}`, {}, 15000);
            if (!res.ok) {
              this.showToast('加载 Skill 列表失败', 'error');
              return;
            }
            const data = await res.json();
            this.skillList      = Array.isArray(data.skills) ? data.skills : [];
            this.skillTotal     = data.total     || 0;
            this.skillInstalled = data.installedCount || 0;
            this.skillCategories = this.buildSkillCategories(data.categories);
            if (this.skillCategory && !this.skillCategories.some(cat => cat.key === this.skillCategory)) {
              this.skillCategory = '';
            }
          } catch (e) {
            this.showToast('无法连接到服务：' + e.message, 'error');
          } finally {
            this.skillLoading = false;
          }
        },

        skillCategoryLabel(key) {
          const labels = {
            Business: '商业',
            Education: '教育',
            Finance: '金融',
            Government: '政务',
            Healthcare: '医疗',
            Utilities: '工具',
          };
          return labels[key] || key || '全部分类';
        },

        buildSkillCategories(categories) {
          const normalized = [{ key: '', label: '全部分类' }];
          if (!Array.isArray(categories)) return normalized;

          for (const category of categories) {
            const key = String(category?.key || '').trim();
            if (!key) continue;

            const label = String(category?.label || '').trim() || this.skillCategoryLabel(key);
            const count = Number.isFinite(Number(category?.count)) ? Number(category.count) : null;
            normalized.push({
              key,
              label: count === null ? label : `${label} (${count})`,
            });
          }

          return normalized;
        },

        skillTotalPages() {
          return Math.max(1, Math.ceil(this.skillTotal / this.skillPageSize));
        },

        onSkillSearchInput() {
          clearTimeout(this._skillSearchTimer);
          this._skillSearchTimer = setTimeout(() => {
            this.skillPage = 1;
            this.loadSkills();
          }, 350);
        },

        onSkillCategoryChange() {
          this.skillPage = 1;
          this.loadSkills();
        },

        skillPrevPage() {
          if (this.skillPage > 1) {
            this.skillPage--;
            this.loadSkills();
          }
        },

        skillNextPage() {
          if (this.skillPage < this.skillTotalPages()) {
            this.skillPage++;
            this.loadSkills();
          }
        },

        skillKey(skill) {
          return (skill.category ? skill.category + '/' : '') + skill.name;
        },

        async installSkill(skill) {
          const key = this.skillKey(skill);
          this.skillActionLoading = { ...this.skillActionLoading, [key]: true };
          try {
            const res = await this.fetchWithTimeout('/api/skills/install', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ skill: key }),
            }, 30000);
            if (res.ok) {
              skill.installed = true;
              this.skillInstalled++;
              this.showToast(`已安装：${skill.name}`);
            } else {
              const err = await res.json().catch(() => ({}));
              this.showToast(err.message || '安装失败', 'error');
            }
          } catch (e) {
            this.showToast('无法连接到服务：' + e.message, 'error');
          } finally {
            const updated = { ...this.skillActionLoading };
            delete updated[key];
            this.skillActionLoading = updated;
          }
        },

        async uninstallSkill(skill) {
          const key = this.skillKey(skill);
          this.skillActionLoading = { ...this.skillActionLoading, [key]: true };
          try {
            const res = await this.fetchWithTimeout('/api/skills/uninstall', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ skill: key }),
            }, 30000);
            if (res.ok) {
              skill.installed = false;
              this.skillInstalled = Math.max(0, this.skillInstalled - 1);
              this.showToast(`已卸载：${skill.name}`);
            } else {
              const err = await res.json().catch(() => ({}));
              this.showToast(err.message || '卸载失败', 'error');
            }
          } catch (e) {
            this.showToast('无法连接到服务：' + e.message, 'error');
          } finally {
            const updated = { ...this.skillActionLoading };
            delete updated[key];
            this.skillActionLoading = updated;
          }
        },

        // ─── API Config ───────────────────────────────────────────────

        async saveApiConfig() {
          this.apiSaving = true;
          try {
            const res = await this.fetchWithTimeout('/api/config/api', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.apiForm),
            }, this.requestTimeout.save);
            if (res.ok) {
              const data = await res.json().catch(() => ({}));
              const warning = Array.isArray(data.warnings) && data.warnings.length > 0
                ? `；告警：${data.warnings.join('；')}`
                : '';
              this.showToast(`API 配置已保存${warning}`);
            } else {
              const err = await res.json().catch(() => ({}));
              const detail = err.message || (Array.isArray(err.errors) ? err.errors.join(' | ') : '');
              this.showToast(detail || '保存失败', 'error');
            }
          } catch (e) {
            this.showToast('无法连接到服务', 'error');
          } finally {
            this.apiSaving = false;
          }
        },
      };
    }
  </script>
</body>
